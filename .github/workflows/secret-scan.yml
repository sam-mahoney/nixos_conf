name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run secret scan
        run: nix build .#checks.x86_64-linux.secret-scan
